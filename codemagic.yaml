# ~/Documents/git/chatnyto/codemagic.yaml 28 Jul 2026 at 02:30:06 PM
workflows:
  ios-build-workflow:
    name: iOS Unsigned Build
    working_directory: flutter_app/chatnyto 
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'revamp/whatsapp-ux'
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          flutter packages pub get
      - name: Auto-generate iOS Build Directory and Podfile
        script: |
          # Re-creates native metadata/Podfile structures if missing from Git
          flutter create . --platforms=ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build Unsigned iOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Package into Payload Folder
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r unsigned_app.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa

