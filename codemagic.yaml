workflows:
  ios-build-workflow:
    name: iOS Unsigned Build
    working_directory: flutter_app/chatnyto 
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'revamp/whatsapp-ux'
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          flutter packages pub get
      - name: Auto-generate iOS Build Directory
        script: |
          flutter create . --platforms=ios
      - name: Patch iOS Deployment Target and Network Permissions
        script: |
          # 1. Force the Podfile to explicitly use iOS 13.0 target at the very first line
          sed -i '' "1s/^/platform :ios, '13.0'\n/" ios/Podfile
          
          # 2. Inject Network exceptions before the closing dict block
          ruby -e '
            file_path = "ios/Runner/Info.plist"
            content = File.read(file_path)
            network_keys = <<-XML
                <key>NSAppTransportSecurity</key>
                <dict>
                    <key>NSAllowsArbitraryLoads</key>
                    <true/>
                </dict>
                <key>NSLocalNetworkUsageDescription</key>
                <string>This application requires local network connectivity for development APIs.</string>
            XML
            if content.include?("</dict>")
              patched_content = content.rpartition("</dict>").insert(1, network_keys).join
              File.write(file_path, patched_content)
              puts "Successfully patched Info.plist"
            else
              puts "Error: </dict> tag not found"
              exit 1
            end
          '
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build Unsigned iOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Package into Payload Folder
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r unsigned_app.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa

