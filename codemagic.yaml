workflows:
  ios-build-workflow:
    name: iOS Unsigned Build
    working_directory: flutter_app/chatnyto 
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'revamp/whatsapp-ux'
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          flutter packages pub get
      - name: Auto-generate iOS Build Directory
        script: |
          flutter create . --platforms=ios
      - name: Patch iOS Deployment Target and Network Permissions
        script: |
          # 1. Update Podfile minimum deployment target to iOS 13.0
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile
          
          # 2. Inject HTTP / Local Network exceptions into Info.plist safely using a temporary file
          PLIST_PATH="ios/Runner/Info.plist"
          
          # Create the block of XML keys to inject
          NETWORK_KEYS=$(cat << 'EOF'
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>NSLocalNetworkUsageDescription</key>
              <string>This application requires local network connectivity for development APIs.</string>
          EOF
          )
          
          # Insert the block directly right before the last closing </dict> tag in Info.plist
          printf '%s\n' "g/<\/dict>/i" "$NETWORK_KEYS" "." "w" "q" | ed -s "$PLIST_PATH"
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build Unsigned iOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Package into Payload Folder
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r unsigned_app.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa

