# ~/Documents/git/chatnyto/codemagic.yaml 28 Jul 2026 at 02:24:01 PM
workflows:
  ios-build-workflow:
    name: iOS Unsigned Build
    working_directory: flutter_app/chatnyto 
    max_build_duration: 60
    instance_type: mac_mini_co2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - target: revamp/whatsapp-ux
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build Unsigned iOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Package into Payload Folder
        script: |
          # Side-loading tools expect an .ipa container containing a 'Payload' folder
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r unsigned_app.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa

