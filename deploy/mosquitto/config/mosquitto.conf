# ~/Documents/git/chatnyto/deploy/mosquitto/config/mosquitto.conf 27 Jul 2026 at 12:31:23 PM
# Production MQTT broker for ChatNyto.
#
# Two listeners:
#   1883  plain MQTT, reachable only inside the compose network (and, if you
#         open the firewall, from the LAN). Nothing publishes it to the
#         internet.
#   9001  MQTT over WebSockets, which is what the reverse proxy / tunnel
#         exposes as wss://<domain>/mqtt. A raw MQTT port cannot pass through
#         an HTTP tunnel; WebSockets can, and the ChatNyto app speaks both.
#
# Messages are already end-to-end encrypted by the app, so the broker only
# ever relays ciphertext. TLS and authentication are still required: they
# stop strangers from using your broker as a free relay and keep metadata
# (who is online, which topics exist) off the open internet.

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
# Connection logging is intentionally off: it would record who connects and
# when, which is exactly the metadata this app tries not to accumulate.
log_type information

# No anonymous clients. Add accounts with:
#   docker compose exec mqtt mosquitto_passwd -b /mosquitto/config/passwd USER PASS
allow_anonymous false
password_file /mosquitto/config/passwd

# Only ChatNyto's own topic tree is writable, and only by authenticated
# users (see aclfile).
acl_file /mosquitto/config/acl

max_keepalive 120
# A LoRa-sized message is tiny; this cap stops someone from pushing large
# payloads through a shared broker.
message_size_limit 262144
max_inflight_messages 40
max_queued_messages 2000

listener 1883
protocol mqtt

listener 9001
protocol websockets
