# ~/Documents/git/chatnyto/deploy/docker-compose.yml 27 Jul 2026 at 12:31:28 PM
# Production MQTT broker for ChatNyto.
#
# Nothing is published to the host: traffic arrives through the Cloudflare
# tunnel, exactly like the other service on this server. The tunnel maps
#   wss://<your domain>/mqtt  ->  http://mqtt:9001
# so the app connects with a wss:// URL and no port has to be opened.
#
# Start with:  ./deploy/deploy.sh
services:
  mqtt:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    # Deliberately no `ports:` — the broker is only reachable through the
    # tunnel (and from other containers on this network).
    healthcheck:
      test:
        - CMD
        - mosquitto_sub
        - -h
        - localhost
        - -p
        - "1883"
        - -t
        - $$SYS/broker/uptime
        - -C
        - "1"
        - -u
        - ${MQTT_HEALTH_USER}
        - -P
        - ${MQTT_HEALTH_PASSWORD}
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Serves one file: /.well-known/chatnyto.json, which tells the app how to
  # reach this broker. It is what makes typing just the domain enough — the
  # user never sees a port, a WebSocket path or a password.
  profile:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./wellknown:/usr/share/nginx/html/.well-known:ro
    # No `ports:` either; the tunnel routes /.well-known/ to it.

  # Optional, and off unless asked for with `--profile turn`.
  #
  # Two people on the same WiFi call each other directly and need none of
  # this. Two people on mobile data cannot: each phone sits behind the
  # carrier's NAT with no address the other could dial. A TURN server is the
  # meeting point that makes that call possible, and coturn is the standard
  # one.
  #
  # It is the one part of this stack that cannot go through the tunnel: TURN
  # is UDP, and an HTTP tunnel carries no UDP. So it publishes real ports,
  # and they have to be open in the server's firewall — which is exactly why
  # it is opt-in rather than on by default.
  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    profiles: ["turn"]
    # Host networking: coturn hands out the relay addresses it sees itself
    # on, and behind Docker's NAT those are addresses nobody can reach.
    network_mode: host
    command:
      - -n
      - --no-cli
      - --lt-cred-mech
      - --fingerprint
      - --realm=${PUBLIC_HOST}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --external-ip=${TURN_PUBLIC_IP}
      # A relay that will forward to anything is a relay someone else will
      # use to reach places they should not.
      - --no-multicast-peers
      - --no-loopback-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mqtt
      - profile

volumes:
  mqtt-data:
  mqtt-log:
